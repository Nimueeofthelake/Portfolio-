<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All About Me - Alina</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f5eaff);
            color: #29243a;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #6c4ab6, #8e63d9);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background-color: white;
            margin-bottom: 25px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 6px solid #7954c6;
        }

        .card h2 {
            color: #6944b5;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .card p {
            font-size: 17px;
        }

        .highlight {
            background: #f0eaff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f5f1ff;
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 8px;
        }

        footer {
            background-color: #30234a;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

        .emoji {
            font-size: 35px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 38px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>
